
name: Get SF Symbols SVG

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Download SF Symbols collection
        run: |
          git clone --depth 1 https://github.com/brendanballon/sfsymbols-svg.git sf-source

      - name: Extract requested SVG files
        shell: bash
        run: |
          mkdir -p extracted

          symbols=(
            "arrow.up"
            "arrow.down"
            "hand.point.up.left.fill"
            "magnifyingglass"
            "pause.fill"
            "chevron.left.forwardslash.chevron.right"
            "xmark"
            "hand.draw.fill"
            "r.joystick.fill"
            "slider.horizontal.3"
            "arrow.counterclockwise"
          )

          for symbol in "${symbols[@]}"; do
            file=$(find sf-source/symbols -type f -name "$symbol.svg" -print -quit)

            if [ -n "$file" ]; then
              cp "$file" "extracted/$symbol.svg"
              echo "FOUND: $symbol"
            else
              echo "MISSING: $symbol"
            fi
          done

      - name: Upload SVG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SF-Symbols-SVG
          path: extracted/
          if-no-files-found: error
